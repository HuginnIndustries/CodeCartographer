name: Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'codecartographer-pi version to smoke-test (default: package.json#version)'
        required: false
  workflow_run:
    workflows: ['Release']
    types: [completed]
  schedule:
    - cron: '17 6 * * *'

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run smoke test
        run: node scripts/smoke-mcp.mjs ${{ inputs.version && format('--version {0}', inputs.version) || '' }}
