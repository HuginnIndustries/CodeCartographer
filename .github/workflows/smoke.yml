name: Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'codecartographer-pi version to smoke-test (default: package.json#version)'
        required: false
  schedule:
    - cron: '17 6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install harness dependencies
        # The smoke script imports @modelcontextprotocol/sdk at the top.
        # The published package is installed into a temp dir by the script
        # itself, but the driver needs the SDK at the repo root to start.
        run: npm ci
      - name: Run smoke test
        run: node scripts/smoke-mcp.mjs ${{ inputs.version && format('--version {0}', inputs.version) || '' }}
