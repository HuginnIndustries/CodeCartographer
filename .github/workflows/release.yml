name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Resolve version and tag
        id: meta
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$PKG_VERSION" ]; then
              echo "Tag v$TAG does not match package.json version $PKG_VERSION" >&2
              exit 1
            fi
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$PKG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack tarball for pre-publish smoke test
        id: pack
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TARBALL="$RUNNER_TEMP/codecartographer-pi-$VERSION.tgz"
          npm pack --pack-destination "$RUNNER_TEMP"
          test -f "$TARBALL" || { echo "expected $TARBALL after npm pack" >&2; exit 1; }
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Smoke test the packed tarball
        run: node scripts/smoke-mcp.mjs --tarball "${{ steps.pack.outputs.tarball }}"
      - name: Publish to npm (idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "codecartographer-pi@$VERSION" version >/dev/null 2>&1; then
            echo "codecartographer-pi@$VERSION is already on the npm registry; skipping publish"
          else
            npm publish --provenance --access public
          fi
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG section found for [$VERSION]; using a generic body" >&2
            echo "Release v$VERSION." > "$NOTES_FILE"
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file "${{ steps.notes.outputs.file }}"
          fi
