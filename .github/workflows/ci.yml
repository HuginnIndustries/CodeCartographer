name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build (tsc)
        run: npm run build
      - name: Run framework invariant tests
        run: npm test

  # The suite on Windows, gating (#372, #395). Added as reporting-only to
  # settle four claims from the 2026-09-15 self-audit that reading could not
  # — rename-over-existing in atomicWriteFile, the lock's O_EXCL and mtime
  # staleness, path containment's case-fold and realpath walk, bare-git
  # output parsing. It answered all four, the product defects (#393, #394)
  # and the POSIX-shaped expectations (#395) were fixed, and the suite has
  # been green here since.
  #
  # It gates now because reporting-only stopped working: a job that cannot
  # fail the run is a job whose failures get merged. Every Windows failure
  # this job has ever reported was a real defect — none was flaky, and no
  # commit has ever produced both outcomes — but the run conclusion stayed
  # "success" each time, so nothing stopped the merge.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Run framework invariant tests
        run: npm test
