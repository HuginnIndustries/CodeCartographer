name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build (tsc)
        run: npm run build
      - name: Run framework invariant tests
        run: npm test

  # The suite on Windows, reporting rather than gating (#372): four of the
  # 2026-09-15 self-audit's findings are claims about Windows filesystem
  # semantics — rename-over-existing in atomicWriteFile, the lock's O_EXCL
  # and mtime staleness, path containment's case-fold and realpath walk,
  # bare-git output parsing — that reading cannot settle. This job answers
  # them. It does not block a PR; a failure here becomes an issue with a
  # reproduction, and once the suite is green on Windows the job graduates
  # to a gate.
  test-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Run framework invariant tests
        run: npm test
