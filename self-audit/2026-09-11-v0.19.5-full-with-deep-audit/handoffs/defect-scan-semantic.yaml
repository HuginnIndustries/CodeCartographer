closeout_summary: >-
  38 semantic findings (4 high, all probe-confirmed): symlink write-guard bypass, lock release
  steals the next holder's lock, pid+ms temp-name collisions lose concurrent writes, stuck DAG
  reported complete; all nine routed items closed; one root (atomic-write primitive) routed to
