schema_version: 1
phase_id: defect-scan-semantic
owner_notes:
  - >-
    38 findings (0 critical, 4 high, 15 medium, 19 low) across passes 3, 4, 5. Four of the
    highs were reproduced by runtime probes rather than argued from reading: the symlink
    write-guard bypass for not-yet-existing files, the lock release that deletes another
    holder's lock after a stale break, the pid+millisecond temp-name collision that silently
    loses concurrent usage appends and a concurrent publish, and a stuck DAG reported as
    "pipeline complete" by completion, status, next, the skill gate, and amendments.
  - >-
    All nine routed items closed: arch-CF4, mech-CF1..CF6, contracts-CF1, proto-CF1. mech-CF5
    (collect retargeting) did not reproduce and is recorded as a design limitation; mech-CF4
    took a settled action because its question was closed on the SDK source in contracts.
  - >-
    Pass 4 found no XSS or injection path in the dashboard; the real trust-boundary issues are
    the LLM-driven write sandbox (symlink fallback), an unvalidated skill name that reaches a
    path join, and earlier-phase findings text spliced into later prompts without delimiters.
open_questions: []
carry_forward:
  - id: sem-CF1
    kind: defer-to-phase
    target_phase: porting
    description: >-
      Cross-cutting root shared by eight writers (semantic 3.2): every atomic write names its
      temp file <target>.<pid>.<Date.now()>.tmp (core/usage.ts:88, core/library.ts:186,439,693,
      1208, core/workspace.ts:368,452, dashboard-writer.ts:58, core/broadside.ts:1691) and the
      status lock (semantic 3.1) has no ownership token. A port should adopt one atomic-write
      primitive with a unique suffix and an owned lock rather than re-port eight copies.
    deferred_reason: >-
      Consolidating the primitive is a porting-design decision; the defects themselves are
      classified here.
