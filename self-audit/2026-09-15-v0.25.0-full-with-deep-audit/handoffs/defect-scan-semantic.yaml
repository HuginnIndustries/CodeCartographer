owner_notes:
  - "Primary output .codecarto/findings/defect-scan-semantic/semantic-defects.md; validation PASS (9/9 pipeline criteria). 13 findings: 0 critical, 0 high, 5 medium, 8 low (Pass 3 = 7, Pass 4 = 3, Pass 5 = 3)."
  - "Closed all four routed items. cfs-mech-1 (3.1): the .break stale-break race is real and worse than described — the non-atomic stat -> describeLockHolder -> rm in breakStaleLock can delete a freshly acquired lock. cfs-mech-2 (3.2): confirmed; the publish lock held across reindex is the concrete long-held case. cfs-mech-3 (3.3): lock-scope and non-atomic-copy parts confirmed; the claimed writeDashboard call is NOT in the current refresh path. cf-arch-3 (3.1-3.7): each mapped path audited; the SM2 completion commit point itself is sound, only its pre-lock integrity checks are a narrow TOCTOU (3.6)."
  - "New defects beyond the routed ones: 3.4 (standalone library_reindex/list write index.yaml without the publish lock; lost update), 3.5 (sub-agent re-entry guard is check-then-act across the async prompt/LLM-rewrite prelude), 3.7 (writeLibraryConfig unlocked + non-atomic), 4.1 (Broad-Side verify uploads raw file content to OpenRouter without redactSecrets, bypassing the submit redaction guarantee), 4.2 (codecartoModeActive reset on session_start leaves the orchestrator guard off after a reload), 5.1-5.3 (child-guard parity comment, refresh THREAD_LOG non-idempotence, listEntries rewriting a corrupt index)."
  - "Orchestrator duties done. Promoted the single pending proposal markdown-contracts-are-wire-format to CONVENTIONS.md C04 (no pending proposals remain except any this handoff stages). Re-triaged all four inherited questions: q-node-windows-fs-semantics, q-openrouter-batch-semantics, q-pi-sdk-execution-parity remain needs-runtime-test; q-npm-tarball-template-parity remains needs-fixture-capture. Only finding 4.3 (readSpecArg check-then-use on a symlinked path) inherits q-node-windows-fs-semantics at verify at runtime; the lock findings are defects in the code's own ordering logic and carry settled actions."
  - "Contradiction sweep: one measured contradiction with a summarized upstream claim. status.yaml and mechanical-defects.md say refreshScaffold 'fires writeDashboard (fire-and-forget) outside the status.yaml lock'; core/workspace.ts:430-458 and both callers (mcp-server/server.ts:1216-1237, extensions/codecarto/index.ts:1708-1743) contain no writeDashboard on the refresh path. The lock-scope gap and THREAD_LOG append are real; the writeDashboard clause is not. Routed here for the porting phase. The protocols placeholder drifts and C03 promotion are re-confirmed; no other contradiction."
  - "No runtime probes ran (no execution tool); every finding is a source read. The three lock findings are interleavings argued from source; a multi-process probe could confirm or narrow them (named in the report's Runtime probes table and added as a post_pipeline spike)."
