phase_id: defect-scan-mechanical
owner_notes:
  - "Primary output findings/defect-scan-mechanical/mechanical-defects.md; validation PASS (9/9 pipeline criteria). 14 mechanical findings: 1 high, 5 medium, 8 low; Pass 1 = 6, Pass 2 = 3, Pass 6 = 5."
  - "Routed item cf-arch-4 closed: the core/index.ts <-> core/dashboard-writer.ts cycle (finding 1.1) and the core/broadside/state.ts -> client.ts ordering drift (finding 1.2) both work under Node/TypeScript because bindings are dereferenced at call time; each is recorded as a latent portability/refactor hazard with action port differently, so the port must break the cycle rather than reproduce it."
  - "Orchestrator duties done: promoted the two architecture CONVENTIONS proposals to C01 (byte-identical surface prompts) and C02 (idempotent post-commit writes), leaving none pending. Re-triaged the four inherited questions: q-openrouter-batch-semantics, q-pi-sdk-execution-parity, and q-node-windows-fs-semantics remain needs-runtime-test; q-npm-tarball-template-parity remains needs-fixture-capture. No finding in this phase asserts a candidate answer to any of them."
  - "No execution tool was available this session, so zero runtime probes ran; the four Pass 6 portability findings are external-behavior claims carrying verify at runtime, tied to q-node-windows-fs-semantics. Probe stubs are named (not written) in the report's Runtime probes table for the porting phase to pick up."
  - "Contradiction sweep: no measured contradiction with the architecture owner_notes. Claim (a) (core/types,utils,yaml is a stable base; no core->wrapper imports) was re-checked by grep and holds. Claim (c)'s POSIX lock/rename mechanics were confirmed by reading; its Windows-portability portion is left verify at runtime. Claim (b)'s byte-identical prompt assembly is confirmed at source level (both surfaces call buildPrompt); execution parity is not, and remains q-pi-sdk-execution-parity."
open_questions: []
carry_forward:
  - id: cfs-mech-1
    kind: defer-to-phase
    target_phase: defect-scan-semantic
    description: "withRemovalLock (core/status.ts:526-550) breaks a stale removal lock with an unguarded rm; two waiters that both observed it stale can both rm and recreate, defeating the removal serialization the lock exists to provide."
    deferred_reason: "Pass 3 (concurrency/resources) is the semantic defect scan's rubric; refines the architecture's cf-arch-3."
  - id: cfs-mech-2
    kind: defer-to-phase
    target_phase: defect-scan-semantic
    description: "acquireLock treats any lock older than STALE_LOCK_MS = 60_000 (core/status.ts:25) as dead; a lock legitimately held longer (e.g. library publish holding .publish.lock across a full reindex, or a large switchPipeline) can be broken while its owner still writes."
    deferred_reason: "Pass 3 (concurrency/resources) owns stale-lock/race analysis; refines cf-arch-3."
  - id: cfs-mech-3
    kind: defer-to-phase
    target_phase: defect-scan-semantic
    description: "refreshScaffold (core/workspace.ts:430-455) appends THREAD_LOG.md and fires writeDashboard outside the status.yaml lock, so a concurrent completion can interleave with it."
    deferred_reason: "Pass 3 (concurrency/resources) owns lock-scope analysis; refines cf-arch-3."
carry_forward_closures:
  - cf-arch-4
open_question_closures: []
post_pipeline:
