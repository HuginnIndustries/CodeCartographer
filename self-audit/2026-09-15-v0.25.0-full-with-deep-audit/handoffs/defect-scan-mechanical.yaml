    kind: spike
    description: "Run the atomic-rename, lock-race, and symlink-containment probes on a Windows runner to close q-node-windows-fs-semantics; scripts are named in mechanical-defects.md under Runtime probes (mechanic-atomic-rename.mjs, mechanic-lock-race.mjs, mechanic-containment.mjs)."
  - id: post-mech-import-order
    kind: spike
    description: "Static import-graph check for the eventual port: assert the module graph is acyclic and that no module reads a cross-module constant at top level, covering findings 1.1 and 1.2 without a runtime."
decisions:
