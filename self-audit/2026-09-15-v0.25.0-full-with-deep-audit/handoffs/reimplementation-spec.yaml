post_pipeline:
  - id: post-reimpl-yaml-codec-conformance
    kind: spike
    description: "Port the source dialect's round-trip/coercion cases into the chosen target stack (duplicate-key refusal, __proto__ in mappings AND sequence merges, scalar quoting for '2048'/'true'/'null'/'1.5'/'-'/empty, flow-collection policy, key order, tab and multi-document errors, determinism) and assert the seven-constraint conformance before any workflow file is parsed."
  - id: post-reimpl-lock-redesign-probe
    kind: spike
    description: "Prototype and probe the owner-liveness + compare-and-delete lock redesign (spec behaviors 24-27): two-process races with a pre-planted stale lock, a lock held beyond the source's old 60 s TTL, and the remover-vs-acquirer window the current source leaves open; assert exactly one holder at all times and that no live holder's lock is ever deleted."
  - id: post-reimpl-redaction-chokepoint
    kind: spike
    description: "Verify the single outbound redaction chokepoint (spec behavior 32) by planting a secret and running the reconnaissance verify tool loop; assert only [REDACTED:…] leaves the process."
  - id: post-reimpl-defect-recheck
    kind: spike
    description: "Re-read the current source defect set before an implementation acts on it: the checkout may have advanced during this run (the removal lock already token-checks release), so re-confirm rows 3.1-3.4, 4.1, 6.1, and L2 against the source as built."
  - id: post-reimpl-opinionated-spec
    kind: amendment
    description: "Run reimplementation-spec interactively (or amend this one) once q-target-stack, q-scope-cut, and q-yaml-codec-library-choice are ruled on, using templates/reimplementation-spec-opinionated.md to lock the stack, project identity, and scope cut."
