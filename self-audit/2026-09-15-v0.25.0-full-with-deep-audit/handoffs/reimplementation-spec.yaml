owner_notes:
  - "Primary output .codecarto/findings/reimplementation-spec/reimplementation-spec.md; validation PASS (8/8 pipeline criteria). The spec is language-agnostic (variant: language-agnostic, selection: auto-default) because the phase ran under /codecarto-next --auto, which suppresses the Strategic Alignment Hook. Produced 20 conceptual modules with layer split, 46 numbered required behaviors, 41 black-box acceptance scenarios, a protocol/persistence section (P1-P17, SM1-SM7, three persistence classes), an external-dependency stance table, a 19-row portability-hazard table, a 24-row Defect Design Consequences table covering every row of the bundle's Defect Synthesis, a 7-entry Known Unknowns table, and a 14-entry Spike List."
  - "Closed BOTH routed items. cf-porting-1: chose the reproduce-a-small-codec default, with an explicit wrap-and-adapter alternative and a per-ecosystem candidate table, plus the seven-constraint conformance test obligation (the concrete library pick is registered as q-yaml-codec-library-choice because the target stack is unlocked). cf-porting-2: chose three scope tiers (minimum viable = core + one CLI surface + drop-in template; major-workflow = dashboard/config/refresh/amend/usage/second surface; full = library/Broad-Side/Pi UI/synthesis) and pinned the concurrency redesign as required design elements 24-29 (state-file-to-lock map, owner-liveness, compare-and-delete, remover-vs-acquirer closure, one writer-class per state file per C05, deliberate re-entrancy) plus staged/atomic scaffold refresh (behavior 22)."
  - "SKILL discipline honored: every verify-at-runtime row (6.1, 6.2, 6.3, 6.4, L9) was converted to a Spike List entry and NOT into a design consequence; only fix-before-porting and port-differently rows received design consequences. No finding is leave behind, stated explicitly. Five targeted deep reads were made and recorded in Coverage and limits (core/yaml.ts, core/status.ts:442-610, core/utils.ts:1-120, core/workspace.ts:422-465 + core/library.ts:587-625,947-1001, core/broadside/verify.ts:122-181), each justified by a cf-porting-* closure or a defect rationale."
  - "Orchestrator duties done. Re-triage: q-node-windows-fs-semantics, q-openrouter-batch-semantics, and q-pi-sdk-execution-parity remain needs-runtime-test; q-npm-tarball-template-parity remains needs-fixture-capture; none became answerable by the deep reads (which confirm only what the code does). No row in the spec asserts one of their candidate answers with a settled action. Three NEW needs-maintainer-decision questions registered for the suppressed hook's choices: q-target-stack, q-scope-cut, q-yaml-codec-library-choice."
  - "Contradiction sweep: one measured contradiction with the porting bundle's one-line 3.1 summary, routed through owner_notes and the spec's Coverage and limits rather than smoothed over. Current core/status.ts already token-checks releaseOwnedLock and serializes removals under <lock>.break (so 'unguarded .break stale-break' describes an earlier state), but the residual race is real for a different reason: the main-lock open() path does not consult the removal claim, so a fresh acquirer can be created between a remover's staleness re-check and its rm and then deleted. The design consequence (behaviors 25-27) is unchanged. The bundle's other load-bearing reads were re-confirmed by source read: refreshScaffold still copies one-at-a-time with no lock and an unduped THREAD_LOG append (3.3/L12); reindex still writes the index without .publish.lock (3.4); verify's reader still returns raw lines with no redaction (4.1); atomicWriteFile still has no fallback (6.1); the YAML sequence-merge path still plain-assigns parsed keys (L2). The carried contradictions (Pi = 20 commands; README lists four Broad-Side actions while code implements five incl. verify) are re-affirmed."
  - "No tests and no runtime probes ran this session (no execution tool). Every durability/lock/containment/git/OpenRouter/SDK claim is an external-behavior claim or portability hazard with verify at runtime per C03."
open_questions:
  - id: q-target-stack
    kind: needs-maintainer-decision
    description: "Which target language/runtime and project identity should the opinionated spec lock? The auto runner suppressed the Strategic Alignment Hook, so this spec defaulted to language-agnostic and did not choose a stack."
    deferred_reason: "Only the maintainer can pick the target stack and project identity; an opinionated rerun (post-reimpl-opinionated-spec) consumes the choice."
  - id: q-scope-cut
    kind: needs-maintainer-decision
    description: "Which optional subsystems ship at minimum viable tier — Broad-Side provider adapter, versioned library, dashboard, Pi UI? The spec supplies three scope tiers and defaults all four to major/full parity."
    deferred_reason: "cf-porting-2's scope half is answered by the three tiers, but the cut is a product decision the maintainer owns."
  - id: q-yaml-codec-library-choice
    kind: needs-maintainer-decision
    description: "Reproduce a small codec, or wrap a mature YAML library in an adapter that re-imposes the seven dialect constraints — and which library per target ecosystem? The spec recommends reproduce-the-codec and supplies a per-ecosystem candidate table."
    deferred_reason: "Depends on the locked target stack (q-target-stack); the seven-constraint conformance obligation is already fixed."
