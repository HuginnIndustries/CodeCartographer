closeout_content: |-
  # Closeout — porting

  ## Summary

  - Primary output: `.codecarto/findings/porting/reverse-engineering-bundle.md`; validation **PASS** (7/7 pipeline criteria).
  - Synthesized architecture, contracts, protocols, and both defect scans into a single compression boundary for `reimplementation-spec`: system summary, layer map with dependency order, 27-feature contract table, P1-P17/SM1-SM7 protocol/state notes, consolidated portability hazards, observed-vs-inferred separation, domain glossary, a 15-row Source Index with deep-read triggers, and a 24-row Defect Synthesis covering all 27 findings.
  - Closed the routed item `cf-protocols-1`; resolved the `cfs-mech-3` `writeDashboard` contradiction; appended a porting-phase section to all five secondary outputs.
  - No tests and no runtime probes ran; the load-bearing defect and contradiction claims were re-confirmed by targeted source reads only.

  ## Defect synthesis

  - **1 high:** 6.1 (`atomicWriteFile` has no non-atomic fallback) — `external-behavior claim`, `verify at runtime`.
  - **10 medium:** 1.1 (module cycle), 2.2 (refresh no-rollback), 6.2/6.3/6.4 (POSIX lock/containment/git — `verify at runtime`), 3.1 (removal-lock race), 3.2 (fixed-TTL stale break), 3.3 (refresh lock-scope gap), 3.4 (unlocked derived-index writers), 4.1 (`verify` redaction bypass) — the last five are `observed fact`, `fix before porting`.
  - **16 low in 13 groups:** module dependency direction (1.2); YAML `__proto__` gap (1.3); Broad-Side robustness cluster (1.4/1.5/1.6/2.3); dashboard result ignored (2.1); hardcoded constants (6.5); pre-lock closure checks (3.6); mode-guard reset (4.2); unlocked config RMW (3.7); containment check-then-use (4.3, `verify at runtime`); re-entry check-then-act (3.5); child-guard divergence (5.1); THREAD_LOG non-idempotence (5.2); `listEntries` rewrite (5.3).
  - No finding is `leave behind`; every `verify at runtime` row inherits `q-node-windows-fs-semantics`.

  ## cf-protocols-1 closure

  The port must satisfy seven dialect constraints — duplicate-key refusal, a `__proto__`/prototype-pollution guard in **both** mappings and sequence-item merges, the scalar round-trip quoting rule, an explicit flow-collection policy, key order preservation, tab/multi-document rejection, and determinism. It may reproduce the hand-rolled codec or wrap a mature YAML parser in an adapter that re-imposes those contracts; a bare default YAML library is not a port, because every workflow file is a wire format parsed by the same codec. The per-stack library choice is routed to `reimplementation-spec` as `cf-porting-1`.

  ## Contradiction resolved

  `status.yaml` and `mechanical-defects.md` summarized `cfs-mech-3` as "appends `THREAD_LOG.md` and fires `writeDashboard` (fire-and-forget)". Reading `core/workspace.ts:430-458` confirms the lock-scope gap, the non-atomic `copyFile`, and the undeduped `THREAD_LOG` append, but there is **no `writeDashboard` call on the refresh path**. Porting reproduces finding 3.3 and not the `writeDashboard` clause. Also re-affirmed: Pi exposes 20 commands (not "~21"), and Broad-Side implements five actions including `verify`.

  ## Decisions Beyond Prompt

  - Closed `cf-protocols-1` with a constraint framework rather than a parser choice, because the port is language-agnostic.
  - Preserved the semantic phase's defect dispositions exactly, keeping `verify at runtime` on the external-behavior hazards (C03).
  - Resolved the `cfs-mech-3` contradiction in the bundle with an independent source read rather than re-routing it.
  - Promoted `lock-scope-covers-derived-state-writers` to CONVENTIONS C05 (orchestrator duty).
