# Phase handoff schema v1. Copy to scratch/handoffs/<phase-id>.yaml.
# The framework owns canonical timestamps, status.yaml, closeouts, and THREAD_LOG.md.
schema_version: 1
phase_id: <phase-id>
owner_notes: []
open_questions: []
carry_forward: []
carry_forward_closures: []
# Resolved open questions: their IDs are removed from all phases.
open_question_closures: []
# Work after the active pipeline: spikes, amendments, deltas, maintainer rulings,
# or opinionated reruns. Every entry requires a stable id.
post_pipeline: []
decisions: []
# Conventions proposed for promotion. Completion stages each entry in
# CONVENTIONS.md under "## Pending proposals"; the orchestrator promotes or
# removes it at the phase boundary. Entries require non-empty name and rule.
#   - name: <short pattern name>
#     rule: <the rule, one or two sentences>
#     evidence: <optional: where the pattern showed up>
proposed_conventions: []
closeout_summary: ""
# Optional full closeout Markdown. YAML literal blocks are supported.
closeout_content: |-
  # Closeout — <phase-id>

  ## Summary

  -
