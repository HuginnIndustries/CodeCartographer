# Broad-Side batch reconnaissance configuration. Optional.
# Missing keys fall back to the defaults listed below.

# OpenRouter model to use for batch requests. The default is Google Gemini
# 3.7 Flash (batch) — the cheapest batch model with tool-calling support and
# a 1M-token context window. Change this to another OpenRouter batch model
# if you need a different cost/capability trade-off. To compare what's
# available, run codecarto_broadside with action "models" — it lists every
# :batch variant with pricing, context, output caps, structured-output
# support, and optional coding benchmarks. Beware the expensive end of that
# list — some batch models exceed $80 per million output tokens — and note
# that every lens requires structured-output (json_schema) support, which
# submit refuses to proceed without.
#
# model: google/gemini-3.7-flash:batch

# OpenRouter API key. Prefer the OPENROUTER_API_KEY environment variable —
# keys in this file are committed if you track .codecarto/ after init.
# The codecarto_broadside tool also accepts api_key as a parameter.
#
# api_key: ""

# Default lens set for codecarto_broadside submit when no lenses are
# specified. All six lenses are on by default. Remove a lens id to skip it
# globally, or pass an explicit lenses array on the submit call to override.
#
# default_lenses:
#   - architecture
#   - api
#   - security
#   - defect
#   - conventions
#   - porting

# Per-lens model overrides. A lens listed here runs on its own model; every
# other lens uses the `model` above. This is how you spend more where it pays:
# the cheap default is right for architecture and conventions, while security
# and defect findings are the ones a stronger model most changes. Each override
# is pre-flighted like the default — priced from the live catalog, refused
# without structured-output support, and clamped to its own completion ceiling
# — and the submit estimate breaks the cost out per lens so a mixed-model run
# cannot be approved without seeing which lens costs what.
#
# There is deliberately no stronger default shipped here: which model is worth
# the money for the semantic lenses depends on your repository and your budget,
# and picking one for you would spend your money on our guess. Compare
# candidates with the `models` action first.
#
# Two things to check before committing to a model, both learned the hard way:
#
#   1. The `models` action lists whatever OpenRouter advertises a `:batch`
#      variant for, and a good number of those variants do not actually exist —
#      submitting one comes back `Model '<id>' does not have a :batch endpoint.`
#      Nothing in the catalog distinguishes them. Every Anthropic and OpenAI
#      batch id tried so far is rejected this way; Google and DeepSeek work.
#      A rejected batch costs nothing, so probe a candidate on one lens before
#      relying on it.
#   2. A reasoning-capable model spends its output budget thinking, and the
#      thinking is billed at the full output rate. See `reasoning:` below.
#
# lens_models:
#   security: deepseek/deepseek-v4-pro-0813:batch
#   defect: deepseek/deepseek-v4-pro-0813:batch

# Reasoning control, sent on every lens request.
#
# By default Broad-Side caps thinking at a quarter of the lens's output budget,
# leaving the other three quarters for the answer — which is exactly the split
# the cost estimate already assumes.
#
# The cap exists because reasoning competes with the answer for `max_tokens`.
# One measured run spent 5,758 of a 6,000-token budget thinking and left ~230
# tokens for the JSON, which truncated mid-structure on 11 of 13 slices; those
# tokens bill at the full output rate, so it paid for ~6,000 output tokens per
# slice to receive ~230 usable ones. The shipped default model does the same
# thing less consistently — reasoning from 0 to 5,757 tokens across 13 slices,
# three of them cut off — so this is not something only exotic models do.
#
# It is a cap rather than an off switch on purpose. Some endpoints refuse to be
# switched off: `google/gemini-3.8-flash:batch` rejects the entire batch with
# "Reasoning is mandatory for this endpoint and cannot be disabled", which turns
# a partial result into none at all. Capping works either way.
#
# Override only with a raised lens output budget, or the JSON truncates exactly
# as above.
#
# reasoning:
#   effort: low        # minimal | low | medium | high
#   max_tokens: 2000   # or set the thinking budget directly
#   enabled: false     # only where the provider allows it

# Approximate run expense limit in USD. The default is 1.00, and it applies
# whether or not this key is set: the MCP surface cannot ask a human before
# spending, so a repository is guarded before anyone configures it. Before
# submitting, Broad-Side estimates the run cost from the collected file
# sizes and the model's per-token pricing — fetched live from OpenRouter's
# model catalog and cached for 24h. If the estimate exceeds max_cost, submit
# refuses and prints the per-lens breakdown; pass force: true (or approve
# Pi's dialog) to override for one run, raise the value here for a larger
# repository, or set 0 for no limit at all.
#
# This is a pre-flight estimate guardrail, not a runtime stop: OpenRouter
# bills actual usage, which may differ from the estimate either direction.
# Actual cost lands in each run's run-meta.json after collect.
#
# A config.yaml that exists but cannot be parsed refuses submit, collect,
# and models rather than falling back to these defaults — a typo here must
# not silently remove the guard you set.
#
# max_cost: 1.00

# Manual pricing overrides in USD per MILLION tokens. Normally Broad-Side
# looks the model's pricing up automatically; set both fields only when the
# lookup fails (offline, private model) or you want to assert a ceiling.
#
# pricing:
#   input_per_m: 0.375
#   output_per_m: 1.875
# ---------------------------------------------------------------------------
# Run defaults. Each key below mirrors a codecarto_broadside parameter of the
# same name and sets this repository's default for it; an explicit parameter on
# the call always wins. Set them here when a repo's scouting policy is stable,
# so it does not have to be restated on every submit and collect.

# Scan only the modules whose files changed since the previous run's git HEAD.
# Falls back to a full scan on a dirty tree or when no prior run exists.
#
# incremental: false

# Re-submit lens results that came back truncated at the output token limit,
# once, with a doubled output cap. Truncation is always reported either way.
#
# retry_truncated: true

# Run the cross-lens synthesis pass (synthesis.md, the executive report) once
# every lens batch completes.
#
# include_synthesis: true

# Run the triage pass (triage.md, the P0-P3 work order) once every lens batch
# completes.
#
# include_triage: true

# Default poll budget in seconds. 0 returns as soon as the batches are
# submitted, and on collect polls each in-flight batch once and returns with
# whatever is done; a positive value keeps polling that long. Batch jobs
# routinely take tens of minutes, so a submit-then-collect-later rhythm is
# normal.
#
# wait_seconds: 0

# Secret redaction before upload. Every slice, plus the entry point, manifest,
# and README excerpt the architecture lens reads, goes through a pass that
# replaces well-known secret shapes — private-key blocks, AWS/GitHub/OpenAI/
# OpenRouter/Anthropic/Stripe/Slack/Google keys, JWTs, quoted values assigned
# to password/secret/token-style keys, passwords inside URLs — with
# `[REDACTED:<kind>]`, and files named like credential stores (.env*, *.pem,
# *.key, id_rsa*, .npmrc, credentials.json, secrets.yaml, *.tfvars, …) are
# left out of every lens by name. The marker keeps the *presence* of a
# hardcoded credential visible to the security lens; only the value stays
# home. The submit report says what the pass did. This is a safety net for
# an accidental upload, not a substitute for a secret scanner: patterns are
# the low-false-positive ones only.
#
# Set to false only for a repository whose maintainers have decided its
# contents may leave as they are.
#
# redact_secrets: true
